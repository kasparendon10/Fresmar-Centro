<div class="fixed bottom-36 right-4 z-50" id="domicilio-button">

    <!-- Teléfono -->

      📞 Llamar ahora
    </a>
  </div>
</div>

<script>
  function toggleMenu() {
    const menu = document.getElementById("domicilio-menu");
    menu.classList.toggle("hidden");
  }

  document.addEventListener("click", function (e) {
    const button = document.getElementById("domicilio-button");
    if (!button.contains(e.target)) {
      document.getElementById("domicilio-menu").classList.add("hidden");
    }
  });
</script>
